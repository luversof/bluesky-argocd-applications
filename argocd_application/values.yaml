# PC 구분값. 루트 앱(bootstrap/root-home.yaml, root-work.yaml)의 helm parameter 로 덮어쓴다.
#   home: subchart_home/buildInfo-*, values-home.yaml
#   work: subchart_work/buildInfo-*, values-work.yaml
env: home

repoURL: https://github.com/luversof/bluesky-argocd-applications.git
targetRevision: develop

# 앱별 옵션 (생략하면 기본값)
#   envs: [home, work]   이 앱을 등록할 PC. bluesky 는 생략하면 모든 PC, opensource 는 생략하면 등록 안 함. [] 는 둘 다 등록 안 함
#   valuesObject: {}     helm valuesObject 로 넘긴다. valueFiles(values-<env>.yaml 등) 위에 덮인다
#   path: opensource/x   opensource 만. 차트 경로가 opensource/<name> 이 아닐 때
# 목록을 바꾸면 push 전에 scripts/check-apps.sh 로 PC별 등록 목록을 확인한다

# bluesky-project_subchart 를 쓰는 앱. buildInfo 는 이미지 빌드 번호를 가져올 buildInfo-* 이름
bluesky:
  - name: bluesky-cloud-netflix-eureka-server-1
    buildInfo: bluesky-cloud
  - name: bluesky-cloud-netflix-eureka-server-2
    buildInfo: bluesky-cloud
  - name: bluesky-cloud-admin-server
    buildInfo: bluesky-cloud
  - name: bluesky-cloud-config-server
    buildInfo: bluesky-cloud
  - name: bluesky-cloud-gateway
    buildInfo: bluesky-cloud
  - name: bluesky-api-blog
    buildInfo: bluesky-project
    envs: [home]
  - name: bluesky-api-board
    buildInfo: bluesky-project
  - name: bluesky-api-bookkeeping
    buildInfo: bluesky-project
  - name: bluesky-api-poe
    buildInfo: bluesky-project
  - name: bluesky-api-stock
    buildInfo: bluesky-project
  - name: bluesky-api-user
    buildInfo: bluesky-project
  - name: bluesky-web-gate
    buildInfo: bluesky-project
  - name: bluesky-web-apidocs
    buildInfo: bluesky-project
  - name: bluesky-web-user
    buildInfo: bluesky-project
  # 설정 catalog(dynamiccrud2) · connectioninfo 연결은 PC 마다 DB 에 따로 만든다(PC 마다 DB 따로)
  - name: bluesky-web-dynamiccrud2
    buildInfo: bluesky-project

# opensource/<name> 차트를 쓰는 앱. values-<env>.yaml 을 쓴다
# 오픈소스는 PC마다 설치한 것만 다르므로 envs 를 반드시 적는다. envs 가 없거나 비어 있으면 어느 PC에도 등록하지 않는다.
# 실제로 설치된 PC만 넣는다. 목록에 env 를 넣으면 그 PC에 루트 앱이 sync 될 때 새로 설치된다.
opensource:
  - name: jenkins
    envs: [home, work]
  - name: mariadb
    envs: [home, work]
  - name: mssql
    envs: [home, work]
  - name: seaweedfs
    envs: [home, work]
  - name: mongo
    envs: [home, work]
  # Nexus 대체 (Maven: reposilite, Docker: zot)
  - name: reposilite
    envs: [home, work]
  - name: zot
    envs: [home, work]
  - name: rabbitmq
    envs: [home, work]
  - name: redis
    envs: [home, work]
  - name: tempo
    envs: [home, work]
  - name: opentelemetry-collector
    envs: [home, work]
  - name: grafana
    envs: [home, work]
  - name: sonarqube
    envs: [home, work]
  - name: prometheus
    envs: [home, work]
  - name: loki
    envs: [home, work]
  - name: home-assistant
    envs: [home]
  # PostgreSQL 은 메이저 버전마다 앱 하나다. 같은 opensource/postgres 차트를 deployCurrent=false 로 쓰고
  # extraVersions 만 배포한다. 리소스 이름이 postgres-<major>-* 로 분리되고 접속 포트는 54<major> 다
  # (postgres.bluesky.local:5419). 이전 버전을 쓰는 곳이 없어지면 그 앱을 목록에서 뺀다 (18 은 2026-11-24 제거).
  - name: postgres-19
    envs: [home, work]
    path: opensource/postgres
    valuesObject:
      deployCurrent: false
      extraVersions:
        - major: "19"
          image: postgres:19.0
