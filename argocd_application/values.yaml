# PC 구분값. 루트 앱(bootstrap/root-application.yaml)의 helm parameter 로 덮어쓴다.
#   home: subchart_home/buildInfo-*, values-home.yaml
#   work: subchart_work/buildInfo-*, values-work.yaml
env: home

repoURL: https://github.com/luversof/bluesky-argocd-applications.git
targetRevision: develop

# 앱별 옵션 (생략하면 기본값)
#   envs: [home, work]   이 앱을 등록할 PC. bluesky 는 생략하면 모든 PC, opensource 는 생략하면 등록 안 함
#   autoSync: true       false 면 syncPolicy 를 넣지 않는다 (ArgoCD UI 에서 수동 sync)
#   valuesObject: {}     helm valuesObject 를 그대로 넘긴다

# bluesky-project_subchart 를 쓰는 앱. buildInfo 는 이미지 빌드 번호를 가져올 buildInfo-* 이름
bluesky:
  - name: bluesky-cloud-netflix-eureka-server-1
    buildInfo: bluesky-cloud
  - name: bluesky-cloud-netflix-eureka-server-2
    buildInfo: bluesky-cloud
  - name: bluesky-cloud-admin-server
    buildInfo: bluesky-cloud
  - name: bluesky-cloud-config-server
    buildInfo: bluesky-cloud
  - name: bluesky-cloud-gateway
    buildInfo: bluesky-cloud
  - name: bluesky-api-blog
    buildInfo: bluesky-project
    envs: [home]
  - name: bluesky-api-board
    buildInfo: bluesky-project
  - name: bluesky-api-bookkeeping
    buildInfo: bluesky-project
  - name: bluesky-api-poe
    buildInfo: bluesky-project
  - name: bluesky-api-stock
    buildInfo: bluesky-project
  - name: bluesky-api-user
    buildInfo: bluesky-project
  - name: bluesky-web-gate
    buildInfo: bluesky-project
  - name: bluesky-web-swagger-ui
    buildInfo: bluesky-project
  - name: bluesky-web-user
    buildInfo: bluesky-project
  - name: bluesky-web-dynamiccrud
    buildInfo: bluesky-project
    envs: [home]

# opensource/<name> 차트를 쓰는 앱. values-<env>.yaml 을 쓴다
# 오픈소스는 PC마다 설치한 것만 다르므로 envs 를 반드시 적는다. envs 가 없거나 비어 있으면 어느 PC에도 등록하지 않는다.
# 실제로 설치된 PC만 넣는다. 목록에 env 를 넣으면 그 PC에 루트 앱이 sync 될 때 새로 설치된다.
opensource:
  - name: jenkins
    envs: [home, work]
  - name: mariadb
    envs: [home, work]
  - name: mssql
    envs: [home, work]
  - name: seaweedfs
    envs: [home, work]
  - name: mongo
    envs: [home, work]
  # home 전환(Reposilite·zot) 뒤 제거. work 는 2026-11-16 전환 완료
  - name: nexus
    envs: [home]
  # Nexus 대체 (Maven: reposilite, Docker: zot)
  - name: reposilite
    envs: [home, work]
  - name: zot
    envs: [home, work]
  - name: postgres
    envs: [home, work]
  - name: rabbitmq
    envs: [home, work]
  - name: redis
    envs: [home, work]
  - name: tempo
    envs: [home, work]
  - name: opentelemetry-collector
    envs: [home, work]
  - name: grafana
    envs: [home, work]
  - name: sonarqube
    envs: [home, work]
  - name: prometheus
    envs: [home, work]
  - name: loki
    envs: [home, work]
  - name: home-assistant
    envs: [home]
  - name: superset
    envs: []
  - name: minio
    envs: []
  - name: zipkin
    envs: []
  #
  # 추가 PostgreSQL 메이저 버전 예시: 같은 opensource/postgres 차트를 재사용하되 deployCurrent=false 로
