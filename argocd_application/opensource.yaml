apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
spec:
  destination:
    namespace: opensource
    server: 'https://kubernetes.default.svc'
  source:
    path: opensource/jenkins
    repoURL: 'https://github.com/luversof/bluesky-argocd-applications.git'
    targetRevision: develop
    helm:
      valueFiles:
        - values-work.yaml
  sources: []
  project: opensource
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
