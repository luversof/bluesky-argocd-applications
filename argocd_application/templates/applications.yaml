{{- $root := . }}
{{- range .Values.bluesky }}
{{- /* default 를 쓰면 envs: [] 도 빈 값으로 보고 모든 PC 가 된다. 키가 있으면 그대로 쓴다 */}}
{{- $envs := list "home" "work" }}
{{- if hasKey . "envs" }}{{ $envs = .envs }}{{ end }}
{{- if has $root.Values.env $envs }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
spec:
  destination:
    name: in-cluster
    namespace: default
  project: default
  source:
    path: bluesky-project_subchart
    repoURL: {{ $root.Values.repoURL }}
    targetRevision: {{ $root.Values.targetRevision }}
    helm:
      valueFiles:
        - subchart/{{ .name }}/values.yaml
        - subchart_{{ $root.Values.env }}/buildInfo-{{ .buildInfo }}/values.yaml
      {{- with .valuesObject }}
      valuesObject:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
{{- end }}
{{- end }}
{{- range .Values.opensource }}
{{- if has $root.Values.env (.envs | default list) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
spec:
  destination:
    namespace: opensource
    server: https://kubernetes.default.svc
  project: opensource
  source:
    path: {{ .path | default (printf "opensource/%s" .name) }}
    repoURL: {{ $root.Values.repoURL }}
    targetRevision: {{ $root.Values.targetRevision }}
    helm:
      valueFiles:
        - values-{{ $root.Values.env }}.yaml
      {{- with .valuesObject }}
      valuesObject:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
{{- end }}
{{- end }}
