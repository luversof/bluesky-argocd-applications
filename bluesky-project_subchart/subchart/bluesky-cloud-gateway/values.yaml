bluesky-project:
  nameOverride: bluesky-cloud-gateway
  image:
    artifactId: bluesky-cloud-gateway
  service:
    port: 30103
    nodePort: 30103
  ingress:
    enabled: true
    # 앱마다 host 를 추가하지 않도록 와일드카드로 받는다. 어느 앱으로 갈지는 gateway 라우트(bluesky-cloud)가 정한다.
    # Traefik 와일드카드는 한 단계만 매칭한다(a.b.web.bluesky.local 은 안 된다). tls-secret 인증서도 *.cloud·*.api·*.web 를 포함한다.
    hosts:
    - host: "*.cloud.bluesky.local"
      paths:
      - path: /
        pathType: Prefix
    - host: "*.api.bluesky.local"
      paths:
      - path: /
        pathType: Prefix
    - host: "*.web.bluesky.local"
      redirectHttps: true
      paths:
      - path: /
        pathType: Prefix
