bluesky-project:
  nameOverride: bluesky-api-poe
  image:
    artifactId: bluesky-api-poe
  service:
    port: 30135
    nodePort: 30135

  # ── PoE 엔진 런타임 구성 (별도 base 이미지 없음 — 전부 여기서 관리) ─────────────
  # 앱 이미지는 다른 서비스와 동일한 표준 jib 이미지(temurin-alpine + jar + tools/poe-pob).
  # PoB 계산 엔진에 필요한 LuaJIT 런타임은 initContainer 가 pod 기동 시 emptyDir 로 준비한다.
  #  - initContainer 는 앱 컨테이너와 파일시스템이 분리되어 "설치"가 불가 → 필요한 파일만 emptyDir 로 복사
  #  - luajit 실행에 필요한 파일 4개: luajit / libluajit-5.1.so.2 / libgcc_s.so.1 / lua-utf8.so
  #    (lua-utf8 native 모듈은 PoB 필수. temurin 이미지엔 libgcc 도 없어 함께 복사)
  #  - PoB 소스는 hostPath(.poe-gamedata/poe1/work/pob-src)에 있지만 /mnt/c(9p)는 소파일 다량 읽기가 느려
  #    워커 기동이 수십 초씩 걸리므로 emptyDir 로 1회 복사해 로컬 디스크 속도로 읽게 한다(.git 제외)
  # 게임 데이터(JSON/icons)는 Windows 호스트의 ~/.poe-gamedata 를 hostPath 로 직접 마운트(Rancher Desktop/WSL2 = /mnt/c).
  initContainers:
    - name: poe-runtime
      image: alpine:3.20
      command:
        - sh
        - -c
        - |
          set -e
          apk add --no-cache luajit lua5.1-luautf8 rsync
          mkdir -p /rt/bin /rt/lib /rt/lua
          cp /usr/bin/luajit /rt/bin/
          cp /usr/lib/libluajit-5.1.so.2 /usr/lib/libgcc_s.so.1 /rt/lib/
          cp /usr/lib/lua/5.1/lua-utf8.so /rt/lua/
          rsync -a --delete --exclude=.git /host-data/poe1/work/pob-src/ /rt/pob-src/
          rsync -a --delete --exclude=.git /host-data/poe2/work/pob2-src/ /rt/pob2-src/
          echo "poe runtime ready: $(/rt/bin/luajit -v 2>&1)"
      volumeMounts:
        - name: poe-rt
          mountPath: /rt
        - name: poe-data
          mountPath: /host-data
          readOnly: true
  # 데이터 갱신 파이프라인(tools/poe-extract · poe2-extract, 관리 화면 '데이터 갱신')을 파드 안에서 돌리기 위한 도구를
  # 앱 컨테이너 기동 시 설치한다(이미지 관리 없음 — 위 initContainer 와 같은 방침). 기동이 20~40초 늦어지고 인터넷이 필요하다.
  # 뒤의 java 는 jib 기본 entrypoint 와 같고, args(--spring.profiles.active …)는 "$@" 로 넘어간다.
  command:
    - sh
    - -c
    - apk add --no-cache nodejs npm imagemagick imagemagick-webp git luajit && exec java -cp @/app/jib-classpath-file @/app/jib-main-class-file "$@"
    - sh
  # @Value("${poe.*}") 의 env relaxed binding: 점/대시 → '_' (대시 제거형 POE_DATADIR 는 안 붙음)
  # LD_LIBRARY_PATH/LUA_CPATH 는 JVM(ProcessBuilder) 이 luajit 자식 프로세스에 그대로 상속시킨다.
  env:
    # 갱신 스크립트는 os.homedir()/.poe-gamedata 에 쓴다 → 마운트 위치의 부모로 맞춘다(JVM 의 user.home 은 이 값과 무관)
    - name: HOME
      value: /usr/local/app
    - name: POE_DATA_DIR
      value: /usr/local/app/.poe-gamedata/poe1
    - name: POE_POB_SRC_DIR
      value: /opt/poe-rt/pob-src
    # poe2.* 는 poe.data-dir 을 따르지 않고 기본값이 ${user.home}(/root) 기준이라 따로 지정
    - name: POE2_DATA_DIR
      value: /usr/local/app/.poe-gamedata/poe2
    - name: POE2_POB_SRC_DIR
      value: /opt/poe-rt/pob2-src
    # 갱신 스크립트(calibrate · seeds 등)가 엔진 API 를 부를 주소 — 기본값은 로컬 개발 서버(https://localhost:40135)
    - name: POE_API_BASE
      value: http://localhost:30135
    - name: POE_POB_LUAJIT_PATH
      value: /opt/poe-rt/bin/luajit
    - name: LD_LIBRARY_PATH
      value: /opt/poe-rt/lib
    - name: LUA_CPATH
      value: ./?.so;/opt/poe-rt/lua/?.so
  volumeMounts:
    - name: poe-data
      mountPath: /usr/local/app/.poe-gamedata
    - name: poe-rt
      mountPath: /opt/poe-rt
      readOnly: true
  volumes:
    - name: poe-data
      hostPath:
        path: /mnt/c/Users/bluesky/.poe-gamedata
        type: Directory
    - name: poe-rt
      emptyDir: {}
