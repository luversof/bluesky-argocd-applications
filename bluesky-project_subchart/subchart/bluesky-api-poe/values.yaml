bluesky-project:
  nameOverride: bluesky-api-poe
  image:
    artifactId: bluesky-api-poe
  service:
    port: 30135
    nodePort: 30135
  ingress:
#    enabled: true
    hosts:
    - host: poe.api.bluesky.local
      paths:
      - path: /
        pathType: Prefix

  # ── PoE 엔진 런타임 구성 (별도 base 이미지 없음 — 전부 여기서 관리) ─────────────
  # 앱 이미지는 다른 서비스와 동일한 표준 jib 이미지(temurin-alpine + jar + tools/poe-pob).
  # PoB 계산 엔진에 필요한 LuaJIT 런타임은 initContainer 가 pod 기동 시 emptyDir 로 준비한다.
  #  - initContainer 는 앱 컨테이너와 파일시스템이 분리되어 "설치"가 불가 → 필요한 파일만 emptyDir 로 복사
  #  - luajit 실행에 필요한 파일 4개: luajit / libluajit-5.1.so.2 / libgcc_s.so.1 / lua-utf8.so
  #    (lua-utf8 native 모듈은 PoB 필수. temurin 이미지엔 libgcc 도 없어 함께 복사)
  #  - PoB 소스는 hostPath(.poe-gamedata/work/pob-src)에 있지만 /mnt/c(9p)는 소파일 다량 읽기가 느려
  #    워커 기동이 수십 초씩 걸리므로 emptyDir 로 1회 복사해 로컬 디스크 속도로 읽게 한다(.git 제외)
  # 게임 데이터(JSON/icons)는 Windows 호스트의 ~/.poe-gamedata 를 hostPath 로 직접 마운트(Rancher Desktop/WSL2 = /mnt/c).
  persistence:
    enabled: false
  initContainers:
    - name: poe-runtime
      image: alpine:3.20
      command:
        - sh
        - -c
        - |
          set -e
          apk add --no-cache luajit lua5.1-luautf8 rsync
          mkdir -p /rt/bin /rt/lib /rt/lua
          cp /usr/bin/luajit /rt/bin/
          cp /usr/lib/libluajit-5.1.so.2 /usr/lib/libgcc_s.so.1 /rt/lib/
          cp /usr/lib/lua/5.1/lua-utf8.so /rt/lua/
          rsync -a --delete --exclude=.git /host-data/work/pob-src/ /rt/pob-src/
          echo "poe runtime ready: $(/rt/bin/luajit -v 2>&1)"
      volumeMounts:
        - name: poe-rt
          mountPath: /rt
        - name: poe-data
          mountPath: /host-data
          readOnly: true
  # @Value("${poe.*}") 의 env relaxed binding: 점/대시 → '_' (대시 제거형 POE_DATADIR 는 안 붙음)
  # LD_LIBRARY_PATH/LUA_CPATH 는 JVM(ProcessBuilder) 이 luajit 자식 프로세스에 그대로 상속시킨다.
  env:
    - name: POE_DATA_DIR
      value: /usr/local/app/.poe-gamedata
    - name: POE_POB_SRC_DIR
      value: /opt/poe-rt/pob-src
    - name: POE_POB_LUAJIT_PATH
      value: /opt/poe-rt/bin/luajit
    - name: LD_LIBRARY_PATH
      value: /opt/poe-rt/lib
    - name: LUA_CPATH
      value: ./?.so;/opt/poe-rt/lua/?.so
  volumeMounts:
    - name: poe-data
      mountPath: /usr/local/app/.poe-gamedata
    - name: poe-rt
      mountPath: /opt/poe-rt
      readOnly: true
  volumes:
    - name: poe-data
      hostPath:
        path: /mnt/c/Users/bluesky/.poe-gamedata
        type: Directory
    - name: poe-rt
      emptyDir: {}
