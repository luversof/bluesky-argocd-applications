apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant-deployment
  labels:
    app: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      # reverse proxy 설정은 HA 2026.11부터 UI(Settings > System > Network)에서만 한다
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:stable
        env:
        - name: TZ
          value: Asia/Seoul
        ports:
        - containerPort: 8123
        resources:
          requests:
            memory: '512Mi'
          limits:
            memory: '2Gi'
        volumeMounts:
        - name: home-assistant-config
          mountPath: /config
      volumes:
      - name: home-assistant-config
        persistentVolumeClaim:
          claimName: home-assistant-config-pvc
