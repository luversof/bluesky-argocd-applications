apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-deployment
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        runAsUser: 0
      # seaweedfs 는 버킷을 자동 생성하지 않으므로 기동 전에 만들어 준다.
      # 버킷이 없으면 loki 가 S3 404(NoSuchBucket)로 로그를 저장하지 못한다.
      initContainers:
      - name: create-bucket
        image: amazon/aws-cli:latest
        env:
        - name: AWS_ACCESS_KEY_ID
          value: seaweedfs_access_key
        - name: AWS_SECRET_ACCESS_KEY
          value: seaweedfs_secret_key
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        command:
        - /bin/sh
        - -c
        - |
          # Wait for seaweedfs to be ready
          sleep 5
          # Ignore error if bucket already exists
          aws --endpoint-url http://seaweedfs-service:8333 s3 mb s3://loki || true
      containers:
      - name: loki
        image: grafana/loki:latest
        args: 
        - "-config.file=/etc/loki/loki.yaml"
        ports:
        - name: loki
          containerPort: 3100
        volumeMounts:
        - name: loki-config
          mountPath: /etc/loki
        - name: loki-data
          mountPath: /data
      volumes:
      - name: loki-config
        configMap:
          name: loki-configmap
          items:
          - key: loki.yaml
            path: loki.yaml
      - name: loki-data
        persistentVolumeClaim:
          claimName: loki-data-pvc