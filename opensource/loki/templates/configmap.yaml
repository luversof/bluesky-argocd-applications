apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-configmap
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      storage:
        # minio 는 라이선스 이슈로 사용하지 않고 seaweedfs 를 S3 저장소로 사용한다.
        # (tempo 도 동일한 seaweedfs-service:8333 / seaweedfs_* 자격증명을 사용)
        s3:
          endpoint: seaweedfs-service:8333
          s3forcepathstyle: true
          bucketnames: loki
          access_key_id: seaweedfs_access_key
          secret_access_key: seaweedfs_secret_key
          insecure: true
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
      - from: 2024-12-10
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h