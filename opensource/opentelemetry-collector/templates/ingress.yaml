apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opentelemetry-collector-ingress
spec:
  rules:
  - host: opentelemetry-collector.bluesky.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: opentelemetry-collector-service
            port:
              number: 13133
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: opentelemetry-collector-service
            port:
              number: 4318
      - path: /debug
        pathType: Prefix
        backend:
          service:
            name: opentelemetry-collector-service
            port:
              number: 55679
      - path: /debug/pprof
        pathType: Prefix
        backend:
          service:
            name: opentelemetry-collector-service
            port:
              number: 1777