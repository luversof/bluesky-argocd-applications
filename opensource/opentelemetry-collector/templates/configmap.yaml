apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-collector-configmap
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
    processors:
    exporters:
      otlp:
        endpoint: htp://tempo-service.opensource.svc.cluster.local:4317
        tls:
          insecure: true
      debug:
        verbosity: normal
      zipkin:
        endpoint: http://zipkin-service.opensource.svc.cluster.local:9411/api/v2/spans
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: []
          exporters: [otlp, zipkin]
        logs:
          receivers: [otlp]
          processors: []
          exporters: [otlp, zipkin]
