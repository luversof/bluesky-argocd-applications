apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-collector-configmap
data:
  opentelemetry-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318

    processors:
      batch:

    exporters:
      otlp:
        endpoint: tempo-service.opensource.svc.cluster.local:4317
        tls:
          insecure: true
      debug:
        verbosity: normal
      zipkin:
        endpoint: http://zipkin-service.opensource.svc.cluster.local:9411/api/v2/spans

    extensions:
      health_check:
      pprof:
      zpages:

    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlp, zipkin]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
      telemetry:
        metrics:
          address: ${env:MY_POD_IP}:8888