apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data-pvc
spec:
  volumeName: seaweedfs-data-pv
  storageClassName: ""
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data-local-pvc
spec:
  storageClassName: local-path
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
