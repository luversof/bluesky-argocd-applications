{{- if .Values.deployCurrent }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    app: postgres
spec:
  replicas: 1
  # 같은 데이터 디렉터리에 postgres 두 개가 동시에 뜨지 않게 한다
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        postgres-major: "18"
    spec:
      containers:
      - name: postgres
        image: postgres:18.4
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: postgres-user
              name: postgres-secret
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: postgres-secret
        volumeMounts:
        - name: postgres-volume
          mountPath: /var/lib/postgresql/18/docker
      volumes:
      # 9p(D:\) 마운트는 작은 파일 I/O가 매우 느려 VM 내부 local-path에 둔다. 백업은 postgres-backup CronJob
      - name: postgres-volume
        persistentVolumeClaim:
          claimName: postgres-local-pvc
{{- end }}
