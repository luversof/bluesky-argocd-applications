# PostgreSQL 메이저 버전 목록. 버전마다 postgres-<major>-deployment / -service / -local-pvc / -secret / -backup 이
# 따로 생긴다. 버전별 접속 포트는 54<major>(LoadBalancer), 백업은 backup.hostPath.path/<major>/ 에 쌓인다.
# 필드 설명은 templates/versions.yaml 머리말에 있다.
# 메이저 업그레이드 순서는 docs/runbooks/postgres-major-upgrade.md
versions:
  - major: "19"
    image: postgres:19.0

# 고정 주소(postgres-service:5432, postgres.bluesky.local:5432)가 가리킬 버전. versions 에 있어야 한다.
active: "19"

backup:
  hostPath:
    path:
