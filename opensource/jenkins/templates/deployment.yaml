apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-deployment
  labels:
    app: jenkins
spec:
  replicas: 1
  # 데이터 디렉터리를 한 pod 만 쓰도록 옛 pod 를 먼저 내린다 (RollingUpdate 면 잠시 두 pod 가 같은 PVC 에 쓴다)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      containers:
      - name: jenkins
        image: jenkins/jenkins:jdk25
        imagePullPolicy: Always
        lifecycle:
          postStart:
            exec:
              command: 
              - /bin/sh
              - -c
              # yq 는 update argocd manifest job 이 쓴다. 이미지는 jib 으로 push 하므로 docker 는 설치하지 않는다
              - |
                apt-get update
                apt-get install -y yq >/dev/null
        ports:
        - containerPort: 8080
        - containerPort: 50000
        env:
        - name: JAVA_OPTS
          value: "-Duser.timezone=Asia/Seoul -Djenkins.model.Jenkins.workspacesDir=/var/jenkins_workspace/${ITEM_FULL_NAME}"
        resources:
          requests:
#            cpu: '1'
            memory: '1Gi'
          limits:
#            cpu: '2'
            memory: '4Gi'
        volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home
        # workspace와 .m2는 9p(D:\) 마운트가 작은 파일 I/O에서 매우 느려 VM 내부 local-path에 둔다
        - name: jenkins-workspace
          mountPath: /var/jenkins_workspace
        - name: jenkins-m2
          mountPath: /root/.m2
        # postStart 의 apt-get 과 기존 jenkins_home 파일 소유자 때문에 root 로 돈다
        securityContext:
          runAsUser: 0
      volumes:
      - name: jenkins-home
        persistentVolumeClaim:
          claimName: jenkins-home-pvc
      - name: jenkins-workspace
        persistentVolumeClaim:
          claimName: jenkins-workspace-local-pvc
      - name: jenkins-m2
        persistentVolumeClaim:
          claimName: jenkins-m2-local-pvc
