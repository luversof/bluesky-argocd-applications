# update argocd manifest job 이 buildNumber 를 push 한 직후 해당 ArgoCD 앱을 refresh 한다 (scripts/argocd-refresh.sh).
# webhook 이 이 PC 로 들어올 수 없어서, 그대로 두면 ArgoCD 가 다음 git 조회까지 기다린다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-argocd-refresh
  namespace: argocd
rules:
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-argocd-refresh
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-argocd-refresh
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: {{ .Release.Namespace }}
