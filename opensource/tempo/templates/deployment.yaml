apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo-deployment
  labels:
    app: tempo
spec:
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      initContainers:
        # seaweedfs 는 버킷을 자동 생성하지 않으므로 기동 전에 만들어 준다.
        # minio 는 라이선스 이슈로 사용하지 않기 때문에 mc 대신 표준 AWS CLI(S3 API)를 쓴다.
        - name: create-bucket
          image: amazon/aws-cli:latest
          env:
            - name: AWS_ACCESS_KEY_ID
              value: seaweedfs_access_key
            - name: AWS_SECRET_ACCESS_KEY
              value: seaweedfs_secret_key
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command:
            - /bin/sh
            - -c
            - |
              # Wait for seaweedfs to be ready
              sleep 5
              # Ignore error if bucket already exists
              aws --endpoint-url http://seaweedfs-service:8333 s3 mb s3://tempo || true
      containers:
        - name: tempo
          image: grafana/tempo:latest
          args:
            - -target=all
            - -config.file=/conf/tempo.yaml
          ports:
            - containerPort: 3100
              name: prom-metrics
            - containerPort: 6831
              name: jaeger-thrift-c
              protocol: UDP
            - containerPort: 6832
              name: jaeger-thrift-b
              protocol: UDP
            - containerPort: 14268
              name: jaeger-thrift-h
            - containerPort: 14250
              name: jaeger-grpc
            - containerPort: 9411
              name: zipkin
            - containerPort: 55680
              name: otlp-legacy
            - containerPort: 55681
              name: otlp-httplegacy
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 55678
              name: opencensus
          volumeMounts:
            - name: tempo-config
              mountPath: /conf
      volumes:
        - name: tempo-config
          configMap:
            name: tempo-configmap
            items:
              - key: tempo.yaml
                path: tempo.yaml
