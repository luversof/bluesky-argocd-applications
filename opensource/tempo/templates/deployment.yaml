apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo-deployment
  labels:
    app: tempo
spec:
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      initContainers:
        - name: create-bucket
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              # Wait for seaweedfs to be ready
              sleep 5
              mc alias set myseaweedfs http://seaweedfs-service:8333 seaweedfs_access_key seaweedfs_secret_key
              # Ignore error if bucket already exists
              mc mb myseaweedfs/tempo || true
      containers:
        - name: tempo
          image: grafana/tempo
          args:
            - -target=all
            - -config.file=/conf/tempo.yaml
          ports:
            - containerPort: 3100
              name: prom-metrics
            - containerPort: 6831
              name: jaeger-thrift-c
              protocol: UDP
            - containerPort: 6832
              name: jaeger-thrift-b
              protocol: UDP
            - containerPort: 14268
              name: jaeger-thrift-h
            - containerPort: 14250
              name: jaeger-grpc
            - containerPort: 9411
              name: zipkin
            - containerPort: 55680
              name: otlp-legacy
            - containerPort: 55681
              name: otlp-httplegacy
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 55678
              name: opencensus
          volumeMounts:
            - name: tempo-config
              mountPath: /conf
      volumes:
        - name: tempo-config
          configMap:
            name: tempo-configmap
            items:
              - key: tempo.yaml
                path: tempo.yaml
