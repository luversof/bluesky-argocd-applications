apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-configmap
data:
  tempo.yaml: |
    stream_over_http_enabled: true
    server:
      http_listen_port: 3100
      log_level: info

    distributor:
      receivers:
        otlp:
          protocols:
            http:
            grpc:

    ingester:
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 48h

    storage:
      trace:
        backend: s3
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
        s3:
          bucket: tempo
          endpoint: seaweedfs-service:8333
          access_key: seaweedfs_access_key
          secret_key: seaweedfs_secret_key
          insecure: true
          forcepathstyle: true