# 웹 UI용. 이미지 pull/push 는 LoadBalancer 5000 포트를 쓴다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zot-ingress
spec:
  rules:
  - host: zot.bluesky.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zot-service
            port:
              number: 5000
