apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql-deployment
  labels:
    app: mssql
spec:
  replicas: 1
  # 같은 데이터 파일을 두 인스턴스가 동시에 열지 않게 한다 (RollingUpdate 때 9p 파일 잠금으로 기동 실패를 겪음)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mssql
  template:
    metadata:
      labels:
        app: mssql
    spec:
      containers:
      - name: mssql
        image: mcr.microsoft.com/mssql/server:2025-latest
        ports:
        - containerPort: 1433
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              key: mssql-sa-password
              name: mssql-secret
        - name: MSSQL_COLLATION
          value: "Korean_Wansung_CS_AS"
        resources:
          requests:
#            cpu: '500m'
            memory: '1Gi'
          limits:
#            cpu: '500m'
            memory: '2Gi'
        volumeMounts:
        - name: mssql-data
          mountPath: /var/opt/mssql/data
        - name: mssql-log
          mountPath: /var/opt/mssql/log
        - name: mssql-secrets
          mountPath: /var/opt/mssql/secrets
        # BACKUP DATABASE 출력 위치. SQL Server는 9p(D:\)에 백업 파일을 쓰지 못해(DiskChangeFileSize 실패) local-path에 쓰고 mssql-backup CronJob이 D:\로 옮긴다
        - name: mssql-backup
          mountPath: /var/opt/mssql/backup
        securityContext:
          privileged: true
#          allowPrivilegeEscalation: false
          runAsUser: 0
      volumes:
      # 9p(D:\) 마운트는 작은 파일 I/O가 매우 느려 data와 log는 VM 내부 local-path에 둔다
      - name: mssql-data
        persistentVolumeClaim:
          claimName: mssql-data-local-pvc
      - name: mssql-log
        persistentVolumeClaim:
          claimName: mssql-log-local-pvc
      - name: mssql-secrets
        persistentVolumeClaim:
          claimName: mssql-secrets-pvc
      - name: mssql-backup
        persistentVolumeClaim:
          claimName: mssql-backup-staging-local-pvc