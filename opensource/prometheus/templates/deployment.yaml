apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsUser: 0
      containers:
      - name: prometheus
        image: prom/prometheus
        args:
        - "--web.enable-lifecycle"
        - "--config.file=/etc/prometheus/prometheus.yaml"
        # 보관 기간과 용량 상한을 함께 지정한다(둘 중 먼저 걸리는 쪽이 적용).
        # 주의: retention.size 만 주면 기본값 15d 가 사라져 기간 제한이 없어지므로
        # retention.time 도 반드시 함께 명시해야 한다.
        - "--storage.tsdb.retention.time=15d"
        - "--storage.tsdb.retention.size=5GB"
        ports:
        - name: prometheus
          containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-data
          mountPath: /prometheus
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-configmap
          items:
          - key: prometheus.yaml
            path: prometheus.yaml
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-data-pvc