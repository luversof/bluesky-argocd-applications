apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-configmap
data:
  prometheus.yaml: |
    global: 
      scrape_interval: 10s
      scrape_timeout: 9s
      evaluation_interval: 10s
    scrape_configs:
    # prometheus 자기 자신. 이게 없으면 prometheus_* 내부 메트릭이 수집되지 않아
    # "Prometheus 2.0 Stats" 류 대시보드가 통째로 빈다(job 변수도 후보가 0개가 됨).
    - job_name: prometheus
      static_configs:
      - targets: ['localhost:9090']
    # grafana 자체 메트릭. "Grafana metrics" 대시보드가 up{job="grafana"} 를 쓰므로
    # job 이름이 반드시 grafana 여야 한다.
    - job_name: grafana
      static_configs:
      - targets: ['grafana-service.opensource:3000']
    # ArgoCD 메트릭. grafana.com 14584 대시보드가 argocd_* 를 namespace 라벨로 필터하므로
    # namespace=argocd 라벨을 직접 붙여준다.
    #   :8082 application-controller - argocd_app_info / app_sync_total / cluster_*
    #   :8083 server                 - argocd_info / kubectl_*
    #   :8084 repo-server            - argocd_git_request_* / redis_request_*
    - job_name: argocd
      static_configs:
      - targets:
        - 'argocd-metrics.argocd:8082'
        - 'argocd-server-metrics.argocd:8083'
        - 'argocd-repo-server.argocd:8084'
      relabel_configs:
      - target_label: namespace
        replacement: argocd
    - job_name: bluesky-spring-job
      metrics_path: /actuator/prometheus
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_name]
        action: keep
        regex: spring
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: application
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance