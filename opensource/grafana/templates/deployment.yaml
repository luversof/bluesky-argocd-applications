apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: grafana-deployment 
  labels: 
    app: grafana 
spec:
  # 데이터 디렉터리를 한 pod 만 쓰도록 옛 pod 를 먼저 내린다 (RollingUpdate 면 잠시 두 pod 가 같은 PVC 에 쓴다)
  strategy:
    type: Recreate
  selector: 
    matchLabels: 
      app: grafana 
  template: 
    metadata: 
      labels: 
        app: grafana 
    spec: 
      securityContext: 
        runAsUser: 0 
      containers: 
      - name: grafana 
        image: grafana/grafana:latest 
        ports: 
        - containerPort: 3000 
        volumeMounts: 
        - name: grafana-data 
          mountPath: /var/lib/grafana/ 
      volumes: 
      - name: grafana-data 
        persistentVolumeClaim: 
          claimName: grafana-data-pvc