# local-path 데이터는 Rancher Desktop 리셋 시 사라지므로 매일 D:\로 mariadb-dump 백업하고 최신 7개만 남긴다
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-backup
spec:
  schedule: "0 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: backup
            image: mariadb
            env:
            - name: MARIADB_PWD
              valueFrom:
                secretKeyRef:
                  key: mariadb-root-password
                  name: mariadb-secret
            command:
            - sh
            - -c
            - |
              set -e
              f=/backup/mariadb-$(date +%Y-%m-%d-%H%M).sql.gz
              mariadb-dump -h mariadb-service -uroot --all-databases --single-transaction --routines --events --triggers | gzip > "$f.tmp"
              mv "$f.tmp" "$f"
              cd /backup && ls -1t mariadb-*.sql.gz | tail -n +8 | xargs -r rm -f
              ls -l /backup
            volumeMounts:
            - name: backup
              mountPath: /backup
          volumes:
          - name: backup
            hostPath:
              path: {{ .Values.backup.hostPath.path }}
              type: DirectoryOrCreate
