# local-path 데이터는 Rancher Desktop 리셋 시 사라지므로 매일 D:\로 mariadb-dump 백업하고 최신 7개만 남긴다
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-backup
spec:
  schedule: "0 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # 부팅 직후 밀린 실행은 DB 가 아직 안 떠서 실패하므로 몇 번 다시 시도한다 (10·20·40·80초 간격)
      backoffLimit: 4
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: backup
            image: mariadb
            env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  key: mariadb-root-password
                  name: mariadb-secret
            command:
            - bash
            - -c
            - |
              set -euo pipefail
              rm -f /backup/*.tmp   # 실패한 이전 실행이 남긴 조각
              f=/backup/mariadb-$(date +%Y-%m-%d-%H%M).sql.gz
              mariadb-dump -h mariadb-service -uroot --skip-ssl --all-databases --single-transaction --routines --events --triggers | gzip > "$f.tmp"
              mv "$f.tmp" "$f"
              cd /backup && ls -1t mariadb-*.sql.gz | tail -n +8 | xargs -r rm -f
              ls -l /backup
            volumeMounts:
            - name: backup
              mountPath: /backup
          volumes:
          - name: backup
            hostPath:
              path: {{ .Values.backup.hostPath.path }}
              type: DirectoryOrCreate
