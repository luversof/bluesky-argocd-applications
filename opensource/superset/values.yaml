# Apache Superset (Apache-2.0). SQL Lab 로 임의 SQL 탐색 + 대시보드 공유.
# 메타데이터는 컨테이너 내부 SQLite 를 쓰고, 아래 PersistentVolume(hostPath)에 저장해 재시작해도 유지한다.
# (Python 설정 파일 없이 quickstart 그대로 구동. 외부 postgres/redis 미사용)

image:
  repository: apache/superset
  tag: "4.1.1"

# 4.1.0 부터 기본 이미지에서 빠진 데이터소스용 DB 드라이버를 파드 기동 시 pip 로 설치한다.
# 모두 시스템 라이브러리가 필요 없는 순수/휠 드라이버라 이미지 빌드 없이 붙는다.
#   pymysql → MySQL      : mysql+pymysql://user:pass@host:3306/db
#   pymssql → MS SQL     : mssql+pymssql://user:pass@host:1433/db
# 다른 DB가 필요하면 여기에 패키지명을 추가하면 된다.
extraDrivers:
  - pymysql
  - pymssql

# 사내 pip 미러가 필요하면 지정(예: https://repo.g.ncsoft.net/.../simple). 비우면 공개 PyPI 사용.
pipIndexUrl: ""

# MySQL 필수 설정: Superset 의 MySQLEngineSpec.get_datatype 는 결과 컬럼 타입 해석에
# `import MySQLdb` 를 하드코딩한다. pymysql 로 붙어도 이 때문에 결과 조회가 실패하므로,
# pymysql 을 MySQLdb 로도 등록(install_as_MySQLdb)해 `import MySQLdb` 가 통과하게 한다.
# (시스템 라이브러리 불필요. extraDrivers 에 pymysql 이 있을 때만 의미 있음)
registerPymysqlAsMySQLdb: true

# UI 기본 언어. "ko"=한글(프론트엔드는 대부분 번역, 백엔드 일부 문자열은 영어로 남음).
# 빈 값이면 기본 영어. 사용자는 상단 언어 선택기로 en 으로도 전환 가능.
# ko 외 다른 언어를 쓰려면 deployment.yaml 의 LANGUAGES name/flag 도 함께 조정할 것.
defaultLocale: "ko"

# 초기 관리자 계정 (최초 부팅 시 생성, 이후 로그인 후 비밀번호 변경 권장)
admin:
  username: admin
  password: admin
  firstName: Superset
  lastName: Admin
  email: admin@bluesky.local

# SQLite DB + 업로드 파일이 저장되는 superset home 디렉터리를 담을 볼륨.
# 환경별 실제 hostPath 는 values-work.yaml / values-home.yaml 에서 지정한다.
PersistentVolume:
  hostPath:
    path:
