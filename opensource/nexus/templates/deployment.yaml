apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-deployment
  labels:
    app: nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      initContainers:
      - name: volume-mount-hack
        image: busybox
        command: ["sh", "-c", "chown -R 200:200 /nexus-data /nexus-backup"]
        volumeMounts:
        - name: nexus-data
          mountPath: /nexus-data
        - name: nexus-backup
          mountPath: /nexus-backup
      containers:
      - name: nexus
        image: sonatype/nexus3:latest
#        resources:
#          limits:
#            cpu: "4"
        ports:
        - containerPort: 8081
        - containerPort: 8083
        resources:
          requests:
#            cpu: '1'
            memory: '1Gi'
          limits:
#            cpu: '2'
            memory: '3Gi'
        volumeMounts:
        - name: nexus-data
          mountPath: /nexus-data
        # H2 백업 작업(Admin - Backup H2 Database)의 저장 위치. local-path가 사라져도 설정을 복원할 수 있게 D:\에 둔다
        - name: nexus-backup
          mountPath: /nexus-backup
      volumes:
      # 9p(D:\) 마운트는 작은 파일 I/O가 매우 느려 VM 내부 local-path에 둔다
      - name: nexus-data
        persistentVolumeClaim:
          claimName: nexus-data-local-pvc
      - name: nexus-backup
        hostPath:
          path: {{ .Values.backup.hostPath.path }}
          type: DirectoryOrCreate