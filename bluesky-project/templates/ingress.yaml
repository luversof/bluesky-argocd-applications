{{- if .Values.ingress.enabled -}}
{{- $name := include "bluesky-project.name" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $plain := list -}}
{{- $https := list -}}
{{- range .Values.ingress.hosts }}
{{- if .redirectHttps }}{{ $https = append $https . }}{{ else }}{{ $plain = append $plain . }}{{ end }}
{{- end }}
{{- if $plain }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-ingress
spec:
  tls:
  - secretName: tls-secret
  rules:
  {{- range $plain }}
  - host: {{ .host | quote }}
    http:
      paths:
      {{- range .paths }}
      - path: {{ .path }}
        pathType: {{ .pathType }}
        backend:
          service:
            name: {{ $name }}-service
            port:
              number: {{ $svcPort }}
      {{- end }}
  {{- end }}
{{- end }}
{{- if $https }}
---
# 브라우저로 여는 호스트(redirectHttps: true)만 http → https. 세션 쿠키가 Secure 라 http 에서는 로그인이 유지되지 않는다.
# config · eureka · admin 처럼 앱이 http 로 부르는 호스트는 넣지 않는다(Java 클라이언트는 http → https 리다이렉트를 따라가지 않는다).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}-redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-https-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $name }}-redirect-https@kubernetescrd
spec:
  tls:
  - secretName: tls-secret
  rules:
  {{- range $https }}
  - host: {{ .host | quote }}
    http:
      paths:
      {{- range .paths }}
      - path: {{ .path }}
        pathType: {{ .pathType }}
        backend:
          service:
            name: {{ $name }}-service
            port:
              number: {{ $svcPort }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}
