


springProfilesActive: k8sdev

image:
  host:
  artifactId: 
  buildVersion: 
  buildNumber: 
  
nameOverride: ""
  
service:
  type: NodePort
  port: 
  nodePort: 
  
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 10
  periodSeconds: 3
  failureThreshold: 60
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 5
  
resources:
  requests:
    cpu: 20m

# 컨테이너 env / 볼륨 / initContainer passthrough (필요한 앱만 서브차트 values 에서 지정)
env: []
volumeMounts: []
volumes: []
initContainers: []

ingress:
  enabled: false

replicaCount: 1

