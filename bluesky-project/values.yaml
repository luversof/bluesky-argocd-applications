


springProfilesActive: k8sdev

namespace: default

image:
  host:
  artifactId: 
  buildVersion: 
  buildNumber: 
  
imagePullSecrets:
 - name: regcred
nameOverride: ""
  
service:
  type: NodePort
  port: 
  nodePort: 
  
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 10
  periodSeconds: 3
  failureThreshold: 60
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 5
  
resources:
  requests:
    cpu: 20m

# 컨테이너 env / 볼륨 / initContainer passthrough (필요한 앱만 서브차트 values 에서 지정)
env: []
volumeMounts: []
volumes: []
initContainers: []

# 앱 데이터용 PVC (<앱이름>-data 로 생성됨)
persistence:
  enabled: false
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  size: 1Gi
  
ingress:
  enabled: false

replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
